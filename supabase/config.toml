# === New Edge Functions added in security/post-pentest-fixes-2026-05 ===

# Server-side signup wrapper: HIBP + disposable email + IP rate limit + nonce.
# Public (no JWT) — caller is unauthenticated by definition (signing up).
[functions.secure-signup]
verify_jwt = false

# Auth Hook handler for `password_grant_pre_login` — checks login_lockouts table.
# Public (no JWT) — Supabase calls it server-to-server, validates via shared secret.
[functions.auth-pre-login]
verify_jwt = false

# Free-plan substitute for the Auth Hook above. Client-callable wrapper that
# performs lockout pre-check + signInWithPassword + record_login_attempt.
# Becomes redundant when Pro+ Auth Hooks are enabled. See
# DEPLOYMENT_PLAN_2026_05.md Phase 0.
[functions.secure-login]
verify_jwt = false

# === Auth configuration ===
# NOTE: managed deployment is governed by the Supabase dashboard — these
# settings are documentation-only and MUST be mirrored at
# https://supabase.com/dashboard/project/<id>/auth/providers
# (Authentication → Email and Authentication → Password requirements).
#
# Required dashboard configuration (post-pentest 2026-05):
#
#   AUTH-VULN-02 / MISCONFIG-01 fix:
#     - Authentication → Email → "Auto-confirm users" = OFF
#       (previously ON; allowed disposable email signups to be auto-confirmed)
#
#   AUTH-VULN-01 fix (RELAXED 2026-05 by product decision):
#     - Authentication → Password requirements → Min length = 8 (was 12)
#     - Authentication → Password requirements → Required: lowercase + digit only
#       (uppercase and symbol no longer required)
#     - Authentication → Password protection → "Leaked password protection" = OFF
#       (HIBP check disabled per product decision; see secure-signup/index.ts)
#
#   AUTH-VULN-03 fix (Pro+ only):
#     - Authentication → Hooks → Add HTTP hook
#       Type: Password Verification Attempt
#       URL:  https://<project>.supabase.co/functions/v1/auth-pre-login
#       Secret: must match AUTH_HOOK_SECRET env var on the function
